[build-system]
# 77 rather than 61 because the [project] table below uses PEP 639 licence metadata
# (a bare SPDX string plus `license-files`). On setuptools 61-76 that fails schema
# validation inside the PEP 517 hook, so `pip install` dies before anything runs.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siseli-bridge"
# dependencies is dynamic so the runtime pins live in exactly one file. They used to
# be listed here AND in siseli_bridge/requirements.txt, held equal by a test --
# but Dependabot raises one PR per ecosystem+directory, so it could only ever bump
# one copy at a time and every dependency PR it opened failed that test by
# construction. requirements.txt wins because it is the file that ships in the image.
dynamic = ["version", "dependencies"]
requires-python = ">=3.9"
license = "MIT"
# Named explicitly, and NOTICE is named with it: setting this key at all narrows
# setuptools' default glob, so ["LICENSE"] alone would silently drop the file that
# records the upstream project's unlicensed status.
license-files = ["LICENSE", "NOTICE"]
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pyyaml",
    "ruff",
]

# The runtime is launched as `python3 -m src.siseli_bridge.core` from /app, so the
# import root is siseli_bridge/ and the top-level package is literally `src`.
# Auto-discovery cannot infer that (siseli_bridge/ has no __init__.py), so it is
# declared explicitly -- without this the backend builds an empty wheel.
[tool.setuptools]
package-dir = { "" = "siseli_bridge" }
packages = ["src", "src.siseli_bridge"]

[tool.setuptools.dynamic]
version = { attr = "src.siseli_bridge.version.__version__" }
dependencies = { file = ["siseli_bridge/requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["siseli_bridge/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["siseli_bridge/src"]
omit = ["*/__pycache__/*", "*/tests/*"]

# Defect-only rule set: every rule here fires on a genuine bug, never on taste, so
# it can gate CI without becoming a nuisance. No formatter -- reformatting ~2,500
# lines would destroy git blame on hard-won parser knowledge.
[tool.ruff]
target-version = "py39"
line-length = 200

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The star-imports are load-bearing; unwinding them is a refactor, not a lint fix.
"siseli_bridge/src/siseli_bridge/core.py" = ["F403", "F405"]
"siseli_bridge/src/siseli_bridge/mqtt.py" = ["F403", "F405"]
"siseli_bridge/src/siseli_bridge/parsers.py" = ["F403", "F405"]
