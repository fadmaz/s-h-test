name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Install Python dependencies
        # Installing the project itself (rather than re-pinning its deps here) means
        # CI proves the packaging metadata works on every run, and there is no third
        # copy of the pin set to drift. requirements.txt is installed too so the
        # runtime pins the image uses are exercised as well.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r siseli_bridge/requirements.txt

      - name: Run tests
        run: pytest siseli_bridge/tests --cov=siseli_bridge/src --cov-report=term-missing --cov-report=xml -v

      - name: Enforce coverage floors
        # Two report passes over the single run above -- coverage.py has no
        # per-file threshold, and re-running the suite just to gate two modules
        # would double CI time. Floors sit ~2 points under the measured value so
        # ordinary refactoring does not trip them; raise them as coverage grows.
        run: |
          python -m coverage report --fail-under=78
          python -m coverage report --include="*/siseli_bridge/mqtt.py,*/siseli_bridge/core.py" --fail-under=65

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # coverage.xml, not .coverage -- the latter is a SQLite file full of
          # machine-local absolute paths and is unreadable off the runner.
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        # Defect-only rule set (see [tool.ruff.lint] in pyproject.toml). No formatter.
        run: ruff check .

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./siseli_bridge
          # Warnings are informational for now (the add-on has no `image:` key and
          # is not code-notarised). Tighten to true once those are addressed.
          fail_on_warning: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image (amd64)
        # Plain docker build rather than home-assistant/builder: no registry auth
        # needed, ~90s, and it catches the realistic breakage (Dockerfile edits,
        # requirements.txt typos) that today only surfaces on a user's rebuild.
        run: docker build siseli_bridge --build-arg BUILD_FROM=ghcr.io/hassio-addons/base:14.0.0
